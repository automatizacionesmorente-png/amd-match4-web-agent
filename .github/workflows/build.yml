name: Build and push image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: m4-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/web-agent:${{ inputs.tag }}
    steps:
      - name: Free disk space (the ROCm base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Store each layer once (classic overlay2, not the containerd image store)
        run: |
          cfg=$( (sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}') | jq '.features["containerd-snapshotter"]=false')
          echo "$cfg" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sudo rm -rf /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az /usr/lib/jvm /usr/local/julia* /usr/share/miniconda /usr/local/share/chromium /usr/local/share/powershell || true
          docker info --format 'driver={{.Driver}}'
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Torch is still the ROCm build
        run: docker run --rm "$IMAGE" python3 -c "import torch; v=torch.__version__; print(v); assert '+rocm' in v"

      - name: Image size is under 60 GiB
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "$size bytes"
          test "$size" -lt 64424509440

      - name: Smoke test with the real model (CPU, no GPU on this runner)
        run: |
          docker run -d --name agent -e QUERY_BUDGET=600 "$IMAGE"
          for i in $(seq 1 180); do
            docker logs agent 2>&1 | grep -q "model loaded:" && break
            sleep 5
          done
          docker logs agent 2>&1 | tail -20
          docker logs agent 2>&1 | grep -q "model loaded: True"
          docker exec agent python3 /app/app.py --query-id smoke_01 --query "What is the latest Python release version?" --url https://www.python.org/
          docker exec agent python3 /app/app.py --query-id smoke_02 --query "What is the capital of Atlantis according to this site?" --url https://www.python.org/
          docker exec agent sh -c 'cat /app/output/smoke_01_output.json; echo; cat /app/output/smoke_02_output.json; echo'
          docker exec agent python3 -c "import json; a=json.load(open('/app/output/smoke_01_output.json')); b=json.load(open('/app/output/smoke_02_output.json')); assert a['answer'] and a['citations'], a; assert b['answer']=='' and b['citations']==[], b; print('smoke test OK')"
          docker rm -f agent

      - name: Push
        run: docker push "$IMAGE"

      - name: Disk usage (debug)
        if: always()
        run: df -h / || true
