name: Build and push image

on:
  push:
    branches: [mc3-build]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: mc3-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/doc-rag:${{ inputs.tag || 'mc3-v1' }}
    steps:
      - name: Free disk space and move Docker to the larger disk (base image + 7B weights is ~46 GiB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Torch is still the ROCm build
        run: docker run --rm "$IMAGE" python3 -c "import torch; v=torch.__version__; print(v); assert '+rocm' in v"

      - name: Image size is under 60 GiB
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "$size bytes"
          test "$size" -lt 64424509440

      - name: Contract smoke test, no network, unreadable file (the 7B model is too big for this runner's RAM, so it runs text-only)
        run: |
          mkdir -p corpus/docs corpus/archive
          printf 'Widget X-9 datasheet\nMaximum operating voltage .... 48 V\n' > corpus/docs/x9.txt
          printf 'secret\n' > corpus/docs/locked.txt
          head -c 4096 /dev/urandom > corpus/docs/blob.dat
          docker run -d --name rag --network none --cap-drop DAC_OVERRIDE -e MODEL_DIR=/nonexistent "$IMAGE"
          docker cp corpus/. rag:/app/corpus
          docker exec -u 0 rag chmod 000 /app/corpus/docs/locked.txt
          docker exec rag python3 /app/app.py --index /app/corpus
          docker exec rag python3 /app/app.py --corpus /app/corpus --query-id q1 --query "What is the maximum operating voltage of the X-9?"
          docker exec rag cat /app/output/q1_output.json
          docker exec rag python3 -c "import json; d=json.load(open('/app/output/q1_output.json')); assert set(d) >= {'answer','citations','confidence'}, d; print('contract OK')"
          docker logs rag 2>&1 | tail -20
          docker rm -f rag

      - name: Push
        run: docker push "$IMAGE"
