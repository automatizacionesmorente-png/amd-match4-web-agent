name: Build and push image

on:
  push:
    branches: [mc2-build]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: mc2-v1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/plate-ocr:${{ inputs.tag || 'mc2-v1' }}
    steps:
      - name: Free disk space and move Docker to the larger disk (base image + 7B weights is ~46 GiB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Torch is still the ROCm build
        run: docker run --rm "$IMAGE" python3 -c "import torch; v=torch.__version__; print(v); assert '+rocm' in v"

      - name: Image size is under 60 GiB
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "$size bytes"
          test "$size" -lt 64424509440

      - name: Contract smoke test, no network, PNG/JPEG/TIFF (the 7B model is too big for this runner's RAM, so it checks plumbing only)
        run: |
          docker run --rm -v "$PWD:/w" "$IMAGE" python3 -c "from PIL import Image; [Image.new('RGB',(320,160),'white').save(f'/w/img_{e}.{e}') for e in ('png','jpg','tif')]"
          docker run -d --name ocr --network none -e MODEL_DIR=/nonexistent "$IMAGE"
          docker exec ocr mkdir -p /app/input
          for e in png jpg tif; do docker cp img_$e.$e ocr:/app/input/; docker exec ocr python3 /app/app.py --input-image /app/input/img_$e.$e; done
          docker exec ocr python3 -c "import json; [json.load(open(f'/app/output/img_{e}_output.json'))['text'] for e in ('png','jpg','tif')]; print('contract OK')"
          docker logs ocr 2>&1 | tail -20
          docker rm -f ocr

      - name: Push
        # Docker Hub sometimes answers 502 on the multi-GiB weights layer; layers already sent are skipped on retry.
        run: for i in 1 2 3 4 5; do docker push "$IMAGE" && exit 0; echo "push failed, retry $i"; sleep 30; done; exit 1
