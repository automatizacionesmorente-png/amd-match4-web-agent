name: Build and push image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: m4-v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the ROCm base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build
        run: docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/web-agent:${{ inputs.tag }}" .
      - name: Check torch is still the ROCm build
        run: docker run --rm "${{ secrets.DOCKERHUB_USERNAME }}/web-agent:${{ inputs.tag }}" python3 -c "import torch; v=torch.__version__; print(v); assert '+rocm' in v"
      - name: Image size
        run: docker image inspect "${{ secrets.DOCKERHUB_USERNAME }}/web-agent:${{ inputs.tag }}" --format '{{.Size}}' | awk '{printf "%.1f GiB\n", $1/1073741824}'
      - name: Push
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/web-agent:${{ inputs.tag }}"
